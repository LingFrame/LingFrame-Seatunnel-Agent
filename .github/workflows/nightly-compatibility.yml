name: Nightly SNAPSHOT Compatibility

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  compatibility-check:
    name: LingFrame SNAPSHOT Compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LingFrame Main
        uses: actions/checkout@v4
        with:
          repository: LingFrame/LingFrame
          path: lingframe-main
          ref: main

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 8
          cache: 'maven'

      - name: Install LingFrame SNAPSHOT
        run: |
          cd lingframe-main
          mvn -B clean install -DskipTests -pl lingframe-dependencies,lingframe-bom,lingframe-api,lingframe-core -am
          LF_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -pl lingframe-api)
          echo "LF_SNAPSHOT_VERSION=$LF_VERSION" >> $GITHUB_ENV

      - name: Checkout Agent
        uses: actions/checkout@v4
        with:
          path: agent

      - name: Compile Agent Against SNAPSHOT
        run: |
          cd agent
          mvn -B clean compile -Dlingframe.version=${{ env.LF_SNAPSHOT_VERSION }} -pl lingframe-agent-bridge,lingframe-agent-core -am

      - name: Run Agent Unit Tests Against SNAPSHOT
        run: |
          cd agent
          mvn -B test -Dlingframe.version=${{ env.LF_SNAPSHOT_VERSION }} -pl lingframe-agent-bridge,lingframe-agent-core -am

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Nightly SNAPSHOT compatibility broken: LingFrame ${{ env.LF_SNAPSHOT_VERSION }}',
              body: 'The nightly compatibility check failed. LingFrame main branch SNAPSHOT may have introduced breaking changes.\n\n[Failed run](' + context.runUrl + ')',
              labels: ['compatibility', 'high-priority', 'automated']
            })