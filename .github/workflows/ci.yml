name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  MAVEN_OPTS: "-Xmx2g"

jobs:
  build-and-test:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17]

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
          cache: 'maven'


      - name: Build & Quality Gate
        run: mvn -B clean verify -Pintegration-check

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-jdk${{ matrix.java }}
          path: '**/target/site/jacoco/'

      - name: Upload Agent Fat-Jar
        if: matrix.java == 8
        uses: actions/upload-artifact@v4
        with:
          name: lingframe-seatunnel-agent.jar
          path: lingframe-agent-dist/target/lingframe-seatunnel-agent.jar

  e2e-test:
    name: E2E Test (Docker)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 8
          cache: 'maven'


      - name: Build Agent and E2E Artifacts
        run: mvn -B clean install -DskipTests

      - name: Run E2E Tests
        run: |
          cd lingframe-agent-e2e
          docker compose up -d
          echo "Waiting for SeaTunnel cluster (agent: 5801) to become ready..."
          READY_AGENT=false
          READY_NATIVE=false
          for i in $(seq 1 36); do
            if [ "$READY_AGENT" != "true" ] && curl -s -f http://localhost:5801/hazelcast/health/ready >/dev/null; then
              echo "seatunnel-server (agent, port 5801) is READY (attempt $i)!"
              READY_AGENT=true
            fi
            if [ "$READY_NATIVE" != "true" ] && curl -s -f http://localhost:5802/hazelcast/health/ready >/dev/null; then
              echo "seatunnel-native (control, port 5802) is READY (attempt $i)!"
              READY_NATIVE=true
            fi
            if [ "$READY_AGENT" = "true" ] && [ "$READY_NATIVE" = "true" ]; then
              echo "Both SeaTunnel clusters (agent + native) are READY!"
              break
            fi
            echo "Waiting for cluster... ($i/36)"
            sleep 5
          done
          echo "=== Docker Compose PS ==="
          docker compose ps -a
          if [ "$READY_AGENT" != "true" ] || [ "$READY_NATIVE" != "true" ]; then
            echo "=== SeaTunnel Logs upon Crash ==="
            docker compose logs seatunnel-server
            docker compose logs seatunnel-native
            exit 1
          fi
          TEST_STATUS=0
          mvn -B verify || TEST_STATUS=$?
          echo "=== Metaspace Audit Log (target/logs/metaspace-audit.log) ==="
          cat target/logs/metaspace-audit.log 2>/dev/null || echo "No metaspace-audit.log found"
          echo "=== SeaTunnel Server Logs (always captured for cleaner/recycle audit) ==="
          docker compose logs seatunnel-server
          docker compose logs seatunnel-native
          if [ $TEST_STATUS -ne 0 ]; then
            echo "=== SeaTunnel Server Logs upon Failure ==="
            docker compose logs seatunnel-native
            docker compose down -v
            exit $TEST_STATUS
          fi
          docker compose down -v

      - name: Upload E2E Test & Audit Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-audit-reports
          path: |
            lingframe-agent-e2e/target/logs/
            lingframe-agent-e2e/target/failsafe-reports/
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-test, e2e-test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version from POM
        id: get_version
        run: |
          AGENT_VERSION=$(python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('pom.xml'); root = tree.getroot(); ns = {'m': 'http://maven.apache.org/POM/4.0.0'}; v = root.find('m:version', ns); print((v.text if v is not None else root.find('version').text).strip())")
          SEATUNNEL_VERSION=$(python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('pom.xml'); root = tree.getroot(); ns = {'m': 'http://maven.apache.org/POM/4.0.0'}; props = root.find('m:properties', ns); st_v = props.find('m:seatunnel.version', ns) if props is not None else None; print((st_v.text if st_v is not None else '2.3.13').strip())")
          ASSET_NAME="lingframe-seatunnel-agent-${AGENT_VERSION}-seatunnel-${SEATUNNEL_VERSION}.jar"
          echo "version=v${AGENT_VERSION}" >> $GITHUB_OUTPUT
          echo "agent_version=${AGENT_VERSION}" >> $GITHUB_OUTPUT
          echo "seatunnel_version=${SEATUNNEL_VERSION}" >> $GITHUB_OUTPUT
          echo "asset_name=${ASSET_NAME}" >> $GITHUB_OUTPUT

      - name: Check if Tag Already Exists
        id: check_tag
        run: |
          TAG="${{ steps.get_version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, deleting old tag and release for overwrite."
            git push origin :refs/tags/"$TAG" || true
            gh release delete "$TAG" --yes || true
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG is new, will publish release."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Download Agent Fat-Jar
        uses: actions/download-artifact@v4
        with:
          name: lingframe-seatunnel-agent.jar
          path: release-assets/

      - name: Prepare Standard Release Asset
        run: |
          cp release-assets/lingframe-seatunnel-agent.jar release-assets/${{ steps.get_version.outputs.asset_name }}

      - name: Create Release and Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.agent_version }}-seatunnel-${{ steps.get_version.outputs.seatunnel_version }}
          generate_release_notes: true
          files: release-assets/${{ steps.get_version.outputs.asset_name }}