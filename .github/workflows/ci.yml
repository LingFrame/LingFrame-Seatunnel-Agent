name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  MAVEN_OPTS: "-Xmx2g"

jobs:
  build-and-test:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17]

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
          cache: 'maven'


      - name: Build & Quality Gate
        # lingframe-agent-benchmark 为本机专用基准模块（system scope 直引本机 SeaTunnel 精简 jar，见其 pom 注释），
        # 必须从常规 reactor 排除，否则 CI runner 无法解析 D:/MavenRepository 路径
        run: mvn -B clean verify -Pintegration-check -pl '!lingframe-agent-benchmark'

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-jdk${{ matrix.java }}
          path: '**/target/site/jacoco/'

      - name: Upload Agent Fat-Jar
        if: matrix.java == 8
        uses: actions/upload-artifact@v4
        with:
          name: lingframe-seatunnel-agent.jar
          path: lingframe-agent-dist/target/lingframe-seatunnel-agent.jar

  e2e-test:
    name: E2E Test (Docker)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 8
          cache: 'maven'


      - name: Build Agent Fat-Jar
        run: mvn -B clean package -DskipTests -pl lingframe-agent-bridge,lingframe-agent-core,lingframe-agent-dist -am

      - name: Run E2E Tests
        run: |
          cd lingframe-agent-e2e
          docker compose up -d
          sleep 30
          mvn -B verify -pl lingframe-agent-e2e
          docker compose down -v

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-test, e2e-test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version from POM
        id: get_version
        run: |
          VERSION=$(python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('pom.xml'); root = tree.getroot(); ns = {'m': 'http://maven.apache.org/POM/4.0.0'}; v = root.find('m:version', ns); print((v.text if v is not None else root.find('version').text).strip())")
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if Tag Already Exists
        id: check_tag
        run: |
          TAG="${{ steps.get_version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping release."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG is new, will publish release."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Download Agent Fat-Jar
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: lingframe-seatunnel-agent.jar
          path: release-assets/

      - name: Create Release and Tag
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          generate_release_notes: true
          files: release-assets/lingframe-seatunnel-agent.jar