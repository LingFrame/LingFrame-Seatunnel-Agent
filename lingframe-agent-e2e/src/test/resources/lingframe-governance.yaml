# LingFrame Agent 治理配置（MetaspaceLeakIT 端到端专用）
#
# 本 E2E 验证的是插件 ClassLoader 物理释放后 Metaspace 不持续增长。
# 治理总开关置 false：Agent 走 PASS_THROUGH（不装配治理、不织入任何切面），
# 消除治理熔断/装配日志污染，纯测 SeaTunnel 引擎原生 Metaspace 行为。
governance:
  enabled: false
  dev-mode: false
  per-job-governance-enabled: false     # 显式关闭（M4 转正后默认 true）：纯测 ClassLoader 清理，不装配作业级治理
  task-execution-advice-enabled: false
  routing:
    gray-routing-enabled: false
  security:
    permission-enabled: false
  resilience:
    circuit-breaker-enabled: false
    rate-limiter-enabled: false
    rate-limit-per-second: 100
    circuit-breaker-failure-rate-threshold: 50
    circuit-breaker-sliding-window-size: 20
    default-timeout-ms: 3000
