services:
  mysql-server:
    image: mysql:8.0
    container_name: mysql-server
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
    command: >
      --default-authentication-plugin=mysql_native_password
      --performance_schema=OFF
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./src/test/resources/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-server:
    image: apache/kafka:3.7.0
    container_name: kafka-server
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-server:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-server:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  seatunnel-server:
    image: apache/seatunnel:2.3.13
    container_name: seatunnel-server
    depends_on:
      mysql-server:
        condition: service_started
      kafka-server:
        condition: service_started
      mongodb:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
    cap_add:
      - SYS_PTRACE
    ports:
      - "5801:5801"
    environment:
      - SEATUNNEL_HOME=/opt/seatunnel
    volumes:
      - ./src/test/resources/seatunnel.yaml:/opt/seatunnel/config/seatunnel.yaml
      - ./docker/hazelcast-agent.yaml:/opt/seatunnel/config/hazelcast.yaml
      - ./src/test/resources/lingframe-governance.yaml:/opt/seatunnel/config/lingframe-governance.yaml
      - ./src/test/resources/log4j2-test.xml:/opt/seatunnel/config/log4j2.xml
      - ./src/test/resources/log4j2.properties:/opt/seatunnel/config/log4j2.properties
      - ../lingframe-agent-dist/target/lingframe-seatunnel-agent.jar:/opt/seatunnel/lib/lingframe-seatunnel-agent.jar
      - ./target/connectors/seatunnel:/opt/seatunnel/connectors/seatunnel
      - ./target/drivers/mysql-connector-java.jar:/opt/seatunnel/lib/mysql-connector-java.jar
      - ./target/drivers/hive-exec.jar:/opt/seatunnel/lib/hive-exec.jar:ro
      - ./target/drivers/libfb303.jar:/opt/seatunnel/lib/libfb303.jar:ro
      - ./src/test/resources/file-input:/opt/seatunnel/e2e-input:ro
    command: >
      sh -c "
        export JAVA_OPTS=\"$${JAVA_OPTS} -XX:+UnlockDiagnosticVMOptions -Dlog4j2.configurationFile=/opt/seatunnel/config/log4j2.xml -javaagent:/opt/seatunnel/lib/lingframe-seatunnel-agent.jar\";
        /opt/seatunnel/bin/seatunnel-cluster.sh
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5801/hazelcast/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30


  # seatunnel-native — 不挂载 Agent 的原生 SeaTunnel，作为 A/B 对照组
  seatunnel-native:
    image: apache/seatunnel:2.3.13
    container_name: seatunnel-native
    depends_on:
      mysql-server:
        condition: service_started
      kafka-server:
        condition: service_started
      mongodb:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
    cap_add:
      - SYS_PTRACE
    ports:
      - "5802:5801"
    environment:
      - SEATUNNEL_HOME=/opt/seatunnel
      - "JAVA_TOOL_OPTIONS=-XX:+UnlockDiagnosticVMOptions"
    volumes:
      - ./src/test/resources/seatunnel.yaml:/opt/seatunnel/config/seatunnel.yaml
      - ./docker/hazelcast-native.yaml:/opt/seatunnel/config/hazelcast.yaml
      - ./src/test/resources/log4j2-test.xml:/opt/seatunnel/config/log4j2.xml
      - ./src/test/resources/log4j2.properties:/opt/seatunnel/config/log4j2.properties
      - ./target/connectors/seatunnel:/opt/seatunnel/connectors/seatunnel
      - ./target/drivers/mysql-connector-java.jar:/opt/seatunnel/lib/mysql-connector-java.jar
      - ./target/drivers/hive-exec.jar:/opt/seatunnel/lib/hive-exec.jar:ro
      - ./target/drivers/libfb303.jar:/opt/seatunnel/lib/libfb303.jar:ro
      - ./src/test/resources/file-input:/opt/seatunnel/e2e-input:ro
    command: >
      sh -c "
        export JAVA_OPTS=\"$${JAVA_OPTS} -XX:+UnlockDiagnosticVMOptions -Dlog4j2.configurationFile=/opt/seatunnel/config/log4j2.xml\";
        /opt/seatunnel/bin/seatunnel-cluster.sh
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5801/hazelcast/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
  mongodb:
    image: mongo:6.0.18
    volumes:
      - ./src/test/resources/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.getSiblingDB('test').events.countDocuments({}) === 100 ? 0 : 1)"]
      interval: 5s
      timeout: 10s
      retries: 30

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    environment:
      CLUSTER_NAME: e2e
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_permissions_enabled: 'false'
      HDFS_CONF_dfs_replication: '1'

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode
    environment:
      SERVICE_PRECONDITION: namenode:9870
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_permissions_enabled: 'false'
      HDFS_CONF_dfs_replication: '1'
    depends_on:
      namenode:
        condition: service_healthy

  hive-metastore:
    image: apache/hive:3.1.3
    environment:
      SERVICE_NAME: metastore
      SERVICE_OPTS: -Dhive.metastore.warehouse.dir=hdfs://namenode:9000/warehouse
    volumes:
      - ./docker/hive-core-site.xml:/opt/hive/conf/core-site.xml:ro
    depends_on:
      datanode:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "bash -c 'echo > /dev/tcp/localhost/9083'"]
      interval: 5s
      timeout: 5s
      retries: 30

networks:
  default:
    name: lingframe-e2e
